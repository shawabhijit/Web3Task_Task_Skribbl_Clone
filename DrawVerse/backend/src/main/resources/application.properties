spring.application.name=backend


spring.datasource.url=jdbc:postgresql://localhost:5432/skribbl_db_clone
spring.datasource.username=postgres
spring.datasource.password=abhijit@07
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.skribbl=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# CORS (adjust for your React dev server)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Room settings
app.room.code-length=6
app.room.max-idle-minutes=30


